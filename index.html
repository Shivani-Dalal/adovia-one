<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Adovia One</title>
    <!--
      The mark alone, on the brand's dark ground. The full lockup does not
      survive 16px — the wordmark turns to grey mush at tab size — so the
      favicon is the rocket, which is the part that stays recognisable. SVG
      rather than a set of PNGs: one file covers every display density.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Runs before first paint, which is the whole point: a module can't, so
      without this a dark-mode user gets a white flash on every cold load. That
      is now the default path rather than a minority one, so this script earns
      its place more than it used to.

      Duplicates `applyTheme` and DEFAULT_THEME in src/lib/theme.ts — keep the
      key AND the default in step. The test is inverted from what you might
      expect: dark is the default, so the attribute goes on unless light was
      chosen on purpose. Absence of a stored value means dark, not light.

      A storage failure (Safari private mode, site data blocked) leaves `light`
      false and so lands on dark, which is the default — the same answer
      storedTheme() gives when it catches. Do not "fix" this by moving the
      attribute write inside the try.
    -->
    <script>
      var light = false;
      try {
        light = localStorage.getItem('adovia-theme-2') === 'light';
      } catch (e) {
        /* storage blocked; fall through to the default */
      }
      if (!light) document.documentElement.dataset.theme = 'dark';
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
